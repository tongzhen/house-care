appId: com.housecare.app
name: Postpone an action without an update error
tags:
  - regression
  - actions
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../subflows/onboard-dishwasher.yaml
- tapOn: ".*Actions, tab.*"
- tapOn: ".*Check and clean the dishwasher filter system.*"
- scrollUntilVisible:
    element: "Tomorrow"
    direction: DOWN
- tapOn: "Tomorrow"
- assertNotVisible: "The action could not be updated"
- assertVisible: "Actions"
- tapOn: ".*History, tab.*"
- assertVisible: ".*Check and clean the dishwasher filter system.*"
- assertVisible: "Snoozed"
