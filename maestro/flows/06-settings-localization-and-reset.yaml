appId: com.housecare.app
name: Exercise settings, localization, notification settings, and reset
tags:
  - regression
  - settings
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../subflows/onboard-dishwasher.yaml
- tapOn: ".*Settings, tab.*"
- tapOn: "Edit home profile"
- assertVisible: "Edit home profile"
- tapOn: "Washing machine"
- tapOn: "‹ Settings"
- assertVisible: ".*Settings.*"
- tapOn: "Dansk"
- assertVisible: "Indstillinger"
- assertVisible: ".*Hjem, tab.*"
- tapOn: "Engelsk"
- assertVisible: ".*Settings.*"
- tapOn: "Notification settings"
- assertVisible: "Notification timing"
- assertVisible: "Monday"
- tapOn: ".*‹ Settings.*"
- assertVisible: ".*Settings.*"
- scrollUntilVisible:
    element: "Reset app data"
    direction: DOWN
- tapOn: "Reset app data"
- assertVisible: "Reset House Care?"
- tapOn: "Cancel"
- assertVisible: ".*Settings.*"
- tapOn: "Reset app data"
- tapOn: "Reset to default"
- assertVisible: "A calmer home starts here."
