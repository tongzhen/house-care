appId: com.housecare.app
name: Create, filter, reopen, and inspect history and issues
tags:
  - regression
  - issues
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../subflows/onboard-dishwasher.yaml
- tapOn: ".*Actions, tab.*"
- tapOn: ".*Check and clean the dishwasher filter system.*"
- scrollUntilVisible:
    element: "Mark as done"
    direction: DOWN
- tapOn: "Mark as done"
- assertVisible: "Completed"
- tapOn: ".*Home, tab.*"
- tapOn: ".*Report an issue.*"
- assertVisible: "Record an issue"
- assertVisible: "Title *"
- tapOn:
    id: "issue-title"
- inputText: "Pixel 8 regression issue"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "issue-save"
    direction: DOWN
- tapOn:
    id: "issue-save"
- assertVisible: ".*Pixel 8 regression issue.*"
- tapOn: "Completed"
- assertVisible: "Completed"
- tapOn: "Issues"
- assertVisible: ".*Pixel 8 regression issue.*"
- launchApp
- tapOn: ".*History, tab.*"
- assertVisible: ".*Pixel 8 regression issue.*"
- tapOn: ".*Pixel 8 regression issue.*"
- assertVisible: "Delete issue and photo"
- tapOn: "Delete issue and photo"
- assertVisible: "Delete this issue and any attached photo?"
- tapOn: "Cancel"
- assertVisible: ".*Pixel 8 regression issue.*"
