appId: com.housecare.app
name: Complete an action without an update error
tags:
  - regression
  - actions
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: ../subflows/onboard-dishwasher.yaml
- tapOn: ".*Actions, tab.*"
- tapOn: ".*Check and clean the dishwasher filter system.*"
- scrollUntilVisible:
    element: "Mark as done"
    direction: DOWN
- tapOn: "Mark as done"
- assertNotVisible: "The action could not be updated"
- assertVisible: "History"
- assertVisible: ".*Check and clean the dishwasher filter system.*"
- assertVisible: "Completed"
