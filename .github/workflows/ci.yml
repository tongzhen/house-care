name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate maintenance catalogue
        run: npm run validate:catalog

  preview-build:
    name: Create EAS preview builds
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start iOS and Android preview builds
        run: eas build --platform all --profile preview --non-interactive --no-wait --json | tee eas-builds.json

      - name: Publish EAS build links
        if: always() && hashFiles('eas-builds.json') != ''
        run: |
          {
            echo '## EAS preview builds'
            jq -r '.[] | select(.buildDetailsPageUrl != null) | "- [\(.platform) build](\(.buildDetailsPageUrl))"' eas-builds.json
          } >> "$GITHUB_STEP_SUMMARY"
