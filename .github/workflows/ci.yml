name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Verify dependency compatibility and security
        run: npm run test:dependencies

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate maintenance catalogue
        run: npm run validate:catalog

      - name: Verify third-party notices
        run: npm run notices:check

  preview-build:
    name: Create EAS preview builds
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start Android preview build
        run: |
          set -o pipefail
          eas build --platform android --profile preview --non-interactive --no-wait --json | tee eas-builds.json

      - name: Publish EAS build links
        if: always() && hashFiles('eas-builds.json') != ''
        run: |
          {
            echo '## Android EAS preview build'
            jq -r '.[] | select(.buildDetailsPageUrl != null) | "- [\(.platform) build](\(.buildDetailsPageUrl))"' eas-builds.json
          } >> "$GITHUB_STEP_SUMMARY"
